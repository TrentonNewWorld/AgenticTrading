# Standalone Discord bot worker — use when the API is already deployed elsewhere
# (e.g. free-tier web service at newworldtrading.onrender.com).
#
# Dashboard → New → Blueprint → connect repo → set Blueprint path to this file.
#
# Render workers have no free plan (minimum Starter ~$7/mo):
# https://render.com/docs/free

services:
  - type: worker
    name: newworldtrading-discord-bot
    env: python
    region: oregon
    plan: starter

    buildCommand: pip install -r requirements-discord.txt
    startCommand: python -m dashboard.backend.integrations.discord_bot

    envVars:
      - key: PYTHONUNBUFFERED
        value: true
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ATL_API_BASE
        value: https://newworldtrading.onrender.com
      # Discord deep links must open the Vercel SPA, not the Render API host.
      - key: PUBLIC_APP_URL
        value: http://localhost:8000
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
      - key: DISCORD_SUPPORT_CHANNEL_ID
        sync: false
      - key: DISCORD_SUPPORT_ROLE_ID
        sync: false
      # /support runs on OpenRouter FREE models only (ids ending ":free").
      # Use a dedicated key with a $0 credit limit set at openrouter.ai.
      - key: OPENROUTER_SUPPORT_API_KEY
        sync: false
      - key: OPENROUTER_SUPPORT_MODEL
        sync: false
      - key: DISCORD_SNARK_CHANNEL_ID
        sync: false
      - key: DISCORD_BOT_API_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COMMONSTACK_API_KEY
        sync: false
      - key: COMMONSTACK_BASE_URL
        sync: false
